<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --cyan: #46d8ff; --cyan-dim: rgba(70,216,255,.28); --amber: #ffc857; }
  html, body { height: 100%; }
  body {
    background: #010409; color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden; overscroll-behavior: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

  /* ---------- BOOT OVERLAY ---------- */
  #boot { position: fixed; inset: 0; background: #010409; z-index: 50;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity .8s ease; padding: 30px; }
  #boot.done { opacity: 0; pointer-events: none; }
  #bootlines { font-size: .8rem; line-height: 2; min-height: 200px; width: 100%; max-width: 420px; }
  #bootlines .ok { color: #7dffb2; }
  #bootTap { display: none; margin-top: 28px; font-family: 'Orbitron', sans-serif; font-size: .78rem;
    letter-spacing: 4px; color: var(--amber); text-shadow: 0 0 12px var(--amber); cursor: pointer;
    animation: blink 1.2s ease-in-out infinite; }
  #bootTap.show { display: block; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* ---------- CONTROL DOCK (minimal 2D, floats above the 3D scene) ---------- */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 14px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, rgba(1,4,9,.55) 60%);
    pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #micwrap { position: relative; margin-bottom: 8px; }
  #mic { width: 76px; height: 76px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(16,58,92,.85), rgba(4,18,31,.9) 75%);
    border: 2px solid var(--cyan); color: #eaf7ff;
    box-shadow: 0 0 24px rgba(70,216,255,.55), inset 0 0 18px rgba(70,216,255,.25); }
  #mic:active { transform: scale(.92); }
  #micwrap.listening #mic { border-color: var(--amber); color: #fff;
    box-shadow: 0 0 30px rgba(255,200,87,.7), inset 0 0 18px rgba(255,200,87,.3); }
  .ripple { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--amber);
    opacity: 0; pointer-events: none; }
  #micwrap.listening .ripple { animation: rip 1.6s ease-out infinite; }
  #micwrap.listening .ripple.d2 { animation-delay: .8s; }
  @keyframes rip { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.9); opacity: 0; } }

  #wakechip { margin-bottom: 10px; font-family: 'Orbitron', sans-serif; font-size: .58rem; letter-spacing: 3px;
    background: rgba(1,8,16,.55); border: 1px solid var(--cyan-dim); color: var(--cyan);
    padding: 10px 22px; cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  #wakechip.armed { border-color: var(--amber); color: var(--amber);
    box-shadow: 0 0 16px rgba(255,200,87,.45); }

  #typerow { display: flex; width: 100%; max-width: 520px; gap: 8px; }
  #textIn { flex: 1; background: rgba(1,8,16,.78); border: 1px solid var(--cyan-dim);
    color: #eaf7ff; padding: 12px; font-family: inherit; font-size: .88rem; outline: none;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
  #textIn:focus { border-color: var(--cyan); }
  #send { background: rgba(16,58,92,.6); border: 1px solid var(--cyan); color: #eaf7ff;
    padding: 0 20px; font-family: 'Orbitron', sans-serif; font-size: .7rem; letter-spacing: 2px; cursor: pointer; }
  #send:active { transform: scale(.95); }
  #dockhint { margin-top: 8px; font-size: .55rem; letter-spacing: 2px; opacity: .4; pointer-events: none; }

  /* ---------- SECURE UPLINK SETUP ---------- */
  #uplink { position: fixed; inset: 0; background: rgba(1,4,9,.94); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 24px; }
  #uplink.show { display: flex; }
  #uplinkPanel { width: 100%; max-width: 400px; border: 1px solid var(--cyan-dim);
    border-top: 2px solid var(--cyan); background: rgba(1,8,16,.96); padding: 22px 20px;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
  .up-title { font-family: 'Orbitron', sans-serif; font-size: .85rem; letter-spacing: 5px; color: #eaf7ff;
    text-shadow: 0 0 10px var(--cyan); text-align: center; }
  .up-sub { font-size: .58rem; letter-spacing: 3px; opacity: .55; text-align: center; margin: 6px 0 18px; }
  #uplinkPanel label { display: block; font-size: .6rem; letter-spacing: 2px; opacity: .85; margin-bottom: 14px; }
  #uplinkPanel input { display: block; width: 100%; margin-top: 6px; background: rgba(1,8,16,.8);
    border: 1px solid var(--cyan-dim); color: #eaf7ff; padding: 11px 12px;
    font-family: inherit; font-size: .85rem; outline: none; opacity: 1; }
  #uplinkPanel input:focus { border-color: var(--cyan); }
  .up-row { display: flex; gap: 10px; margin-top: 4px; }
  #upSave, #upCancel, #upTest { flex: 1; font-family: 'Orbitron', sans-serif; font-size: .62rem; letter-spacing: 2px;
    padding: 12px 0; cursor: pointer; }
  #upSave { background: rgba(16,58,92,.6); border: 1px solid var(--cyan); color: #eaf7ff; }
  #upCancel { background: transparent; border: 1px solid var(--cyan-dim); color: var(--cyan); }
  #upTest { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .up-result { font-size: .6rem; line-height: 1.6; margin-top: 10px; min-height: 1.2em; text-align: center; opacity: .85; }
  .up-result.good { color: #7dffb0; }
  .up-result.bad { color: #ff9a8a; }
  .up-note { font-size: .58rem; opacity: .5; margin-top: 14px; line-height: 1.6; text-align: center; }

  #glfail { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: #010409; color: var(--cyan); padding: 30px; text-align: center; font-size: .8rem; line-height: 2; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<!-- BOOT SEQUENCE -->
<div id="boot"><div id="bootlines"></div><div id="bootTap">▸ TAP TO WAKE JARVIS</div></div>

<!-- SECURE UPLINK SETUP -->
<div id="uplink">
  <div id="uplinkPanel">
    <div class="up-title">SECURE UPLINK</div>
    <div class="up-sub">NEURAL CORE CONNECTION</div>
    <label>BACKEND URL
      <input id="upUrl" type="url" placeholder="https://jarvis-brain.onrender.com" autocomplete="off" spellcheck="false">
    </label>
    <label>PASSPHRASE
      <input id="upKey" type="password" placeholder="your BRAIN_KEY passphrase" autocomplete="off">
    </label>
    <div class="up-row">
      <button id="upSave">ESTABLISH UPLINK</button>
      <button id="upCancel">CANCEL</button>
    </div>
    <div class="up-row">
      <button id="upTest">TEST UPLINK</button>
    </div>
    <div id="upTestResult" class="up-result"></div>
    <div class="up-note">Stored only on this device.<br>The passphrase is never displayed back.<br>Long-press the reactor core to reopen this panel.</div>
  </div>
</div>

<!-- CONTROL DOCK -->
<div id="dock">
  <div id="micwrap">
    <div class="ripple"></div><div class="ripple d2"></div>
    <button id="mic" title="Talk to JARVIS">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
        <path d="M12 18v3.5"/>
        <path d="M8.5 21.5h7"/>
      </svg>
    </button>
  </div>
  <button id="wakechip">◉ WAKE WORD : OFF</button>
  <div id="typerow">
    <input id="textIn" placeholder="Type to JARVIS..." autocomplete="off">
    <button id="send">SEND</button>
  </div>
  <div id="dockhint">LONG-PRESS CORE · UPLINK</div>
</div>

<div id="glfail"><div>3D SYSTEMS OFFLINE<br><span style="opacity:.6">This browser could not start WebGL.<br>Voice and uplink still work below.</span></div></div>

<script type="module">
import * as THREE from 'three';
/* =====================================================================
   JARVIS v4 — full-screen 3D immersive HUD.
   All brain wiring preserved: wake word, neural uplink, armour/ARISE,
   secure uplink panel, local commands. The DISPLAY is now fully 3D.
   ===================================================================== */
/* ================= ARMOUR TRIGGER PHRASES — ONE-EDIT SWAP =================
   "protocol arise" / "arise" is the user's secret max-performance code word.
   Plain text, case-insensitive substring match — no regex escaping needed. */
const ARMOUR_ON_PHRASES = ["protocol arise", "arise", "armour up", "suit up", "full power"];
const ARMOUR_OFF_PHRASES = ["stand down", "armour off", "power down", "normal mode"];
/* =============== end armour trigger phrases =============== */
const micBtn = document.getElementById('mic');
const micWrap = document.getElementById('micwrap');
const BOSS = 'sir';

function stamp() { return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); }

/* ---------- STATUS + LOG → 3D panels (guards: safe before scene init) ---------- */
let currentStatus = 'STANDBY';
function setStatus(s) { currentStatus = s; drawStatus(); }
const logEntries = []; // {who, text, ts} — rendered onto the 3D comms panel
function addLog(who, text) {
  logEntries.push({ who, text, ts: stamp() });
  while (logEntries.length > 24) logEntries.shift();
  drawLog();
}

/* ---------- VOICE ---------- */
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const prefs = [/Google UK English Male/i, /Daniel/i, /Google US English/i,
                 /Microsoft (Guy|David|James)/i, /Alex/i, /Fred/i];
  for (const p of prefs) { const v = vs.find(v => p.test(v.name)); if (v) return v; }
  return vs.find(v => v.lang && v.lang.startsWith('en')) || null;
}
function speak(text) {
  addLog('jarvis', text);
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 0.75; u.lang = 'en-US'; // deeper, calmer delivery
    const v = pickVoice(); if (v) u.voice = v;
    document.body.classList.add('talking'); setStatus('SPEAKING');
    const endSpeech = () => {
      document.body.classList.remove('talking');
      if (wakeModeOn()) setStatus(isAwake() ? 'AWAKE — SPEAK NOW' : 'DORMANT — SAY "JARVIS"');
      else setStatus('STANDBY');
    };
    u.onend = u.onerror = endSpeech;
    // iOS Safari goes silent if cancel() and speak() run back-to-back while idle.
    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
      setTimeout(() => speechSynthesis.speak(u), 150);
    } else {
      speechSynthesis.speak(u);
    }
  } catch (e) {
    document.body.classList.remove('talking');
    setStatus(wakeModeOn() ? (isAwake() ? 'AWAKE — SPEAK NOW' : 'DORMANT — SAY "JARVIS"') : 'STANDBY');
  }
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- SECURE UPLINK (neural core connection) ---------- */
// Pages build marker — do not remove:
const uplinkSetup = 'v4-3d';
const UPLINK_LS_URL = 'jarvis_uplink_url';
const UPLINK_LS_KEY = 'jarvis_uplink_key';
function getUplink() {
  const url = (localStorage.getItem(UPLINK_LS_URL) || '').trim().replace(/\/+$/, '');
  const key = (localStorage.getItem(UPLINK_LS_KEY) || '').trim();
  return (url && key) ? { url, key } : null;
}
function showUplink() {
  document.getElementById('upUrl').value = localStorage.getItem(UPLINK_LS_URL) || '';
  document.getElementById('upKey').value = ''; // never display the passphrase back
  document.getElementById('uplink').classList.add('show');
  setStatus('UPLINK CONFIG');
}
function hideUplink() { document.getElementById('uplink').classList.remove('show'); }
document.getElementById('upSave').addEventListener('click', () => {
  const url = document.getElementById('upUrl').value.trim().replace(/\/+$/, '');
  const key = document.getElementById('upKey').value.trim();
  if (!url || !key || !/^https?:\/\//i.test(url)) { setStatus('INVALID UPLINK DATA'); return; }
  localStorage.setItem(UPLINK_LS_URL, url);
  localStorage.setItem(UPLINK_LS_KEY, key);
  hideUplink();
  speak('Secure uplink established, sir. I am fully online.');
});
document.getElementById('upCancel').addEventListener('click', () => { hideUplink(); setStatus('STANDBY'); });
document.getElementById('upTest').addEventListener('click', async () => {
  const out = document.getElementById('upTestResult');
  const url = document.getElementById('upUrl').value.trim().replace(/\/+$/, '');
  if (!url || !/^https?:\/\//i.test(url)) { out.textContent = 'Enter a backend URL first.'; out.className = 'up-result bad'; return; }
  out.textContent = 'Pinging neural core…'; out.className = 'up-result';
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 25000);
    const res = await fetch(url + '/api/health', { signal: ctrl.signal });
    clearTimeout(to);
    const data = await res.json().catch(() => null);
    if (res.ok && data && data.ok === true) {
      out.textContent = 'UPLINK OK — brain reachable. If chat still fails, the passphrase does not match the BRAIN_KEY on Render.';
      out.className = 'up-result good';
    } else {
      out.textContent = 'Brain answered oddly (HTTP ' + res.status + '). Try again in a few seconds — it may be waking up.';
      out.className = 'up-result bad';
    }
  } catch (e) {
    out.textContent = e && e.name === 'AbortError'
      ? 'No answer in 25s — the brain may be waking from sleep. Wait 30s and test again.'
      : 'No response. Check the URL, or the ALLOWED_ORIGIN on Render — it must be exactly https://sumitsalunke201006.github.io';
    out.className = 'up-result bad';
  }
});

/* ---------- BRAIN: neural core (backend) ---------- */
let convoHistory = []; // last 10 exchanges, kept client-side only
async function askBrain(raw) {
  const cfg = getUplink();
  if (!cfg) { showUplink(); speak('The secure uplink is not configured yet, sir.'); return; }
  setStatus('CONSULTING NEURAL CORE');
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 60000);
    const res = await fetch(cfg.url + '/api/chat', {
      method: 'POST',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'x-jarvis-key': cfg.key },
      body: JSON.stringify({ message: raw, history: convoHistory.slice(-20), armour: armourMode })
    });
    clearTimeout(to);
    const data = await res.json().catch(() => ({}));
    const reply = (data && data.reply ? String(data.reply) : '').trim();
    if (!reply) throw new Error('empty uplink reply');
    convoHistory.push({ role: 'user', content: raw.slice(0, 500) });
    convoHistory.push({ role: 'assistant', content: reply.slice(0, 500) });
    while (convoHistory.length > 20) convoHistory.shift();
    speak(reply);
  } catch (e) {
    if (e && e.name === 'AbortError') {
      speak('Sir, the neural core is taking too long — likely waking from sleep. Give it thirty seconds, then try again.');
    } else {
      speak('Sir, my uplink to the neural core faltered. Give me a moment, then try again.');
    }
  }
}

/* ---------- ARMOUR MODE ---------- */
let armourMode = false; // session state; sent with every /api/chat call
function matchesAny(t, phrases) { return phrases.some(p => t.includes(p)); }
function setArmour(on) {
  armourMode = on;
  document.body.classList.toggle('armour-on', on);
  ariseTarget = on ? 1 : 0; // 3D power-up transformation target
  if (on) { triggerShockwave(); powerTone(true); }
  else powerTone(false);
}

/* ---------- COMMANDS: instant device actions stay local, everything else -> neural core ---------- */
function handleCommand(raw) {
  const t = raw.toLowerCase().trim();
  addLog('you', raw);
  const hitOn = matchesAny(t, ARMOUR_ON_PHRASES);
  const hitOff = matchesAny(t, ARMOUR_OFF_PHRASES);
  if (hitOn && !hitOff) {
    const protocol = t.includes('arise');
    if (!armourMode) { setArmour(true); speak(protocol ? 'Protocol ARISE acknowledged, sir. All systems at maximum.' : 'Armour online, sir. Full potential engaged.'); }
    else speak(protocol ? 'Protocol ARISE is already active, sir.' : 'Armour is already online, sir.');
    return;
  }
  if (hitOff) {
    if (armourMode) { setArmour(false); speak('Armour disengaged, sir.'); }
    else speak('Armour is already offline, sir.');
    return;
  }
  if (t.includes('open youtube')) { speak('Opening YouTube, sir.'); return window.open('https://m.youtube.com', '_blank'); }
  if (t.includes('open google'))  { speak('Opening Google, sir.');  return window.open('https://www.google.com', '_blank'); }
  if (t.includes('ascend'))       { speak('Opening ASCEND, sir. Time to climb.'); return window.open('https://www.ascendlevelup.run.place', '_blank'); }
  const m = t.match(/search for (.+)/) || t.match(/google (.+)/);
  if (m) { speak('Searching for ' + m[1] + ', sir.'); return window.open('https://www.google.com/search?q=' + encodeURIComponent(m[1]), '_blank'); }
  askBrain(raw);
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------- EARS ---------- */
let recognizing = false;
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { speak('I am afraid this browser cannot hear, sir. Please type below, or open me in Chrome on Android.'); return; }
  if (recognizing) return;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { recognizing = true; micWrap.classList.add('listening');
    document.body.classList.add('listening'); setStatus('LISTENING'); };
  const stopUI = () => { recognizing = false; micWrap.classList.remove('listening');
    document.body.classList.remove('listening'); if (currentStatus === 'LISTENING') setStatus('STANDBY'); };
  rec.onend = stopUI;
  rec.onerror = (e) => { stopUI();
    if (e.error === 'not-allowed') speak('Microphone access was denied, sir. Allow it and try again.');
    else if (e.error === 'no-speech') setStatus('STANDBY');
    else if (e.error === 'network') speak('I seem to have lost my connection, sir. Check the internet and try again.');
  };
  rec.onresult = (e) => handleCommand(e.results[0][0].transcript);
  try { rec.start(); } catch (e) { stopUI(); }
}
micBtn.addEventListener('click', listen);

/* ---------- TYPE ---------- */
const textIn = document.getElementById('textIn');
function sendTyped() { const v = textIn.value.trim(); if (!v) return; textIn.value = ''; handleCommand(v); }
document.getElementById('send').addEventListener('click', sendTyped);
textIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTyped(); });

/* ---------- LIVING SYSTEM: telemetry + background processes ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const T = { pwr: 97 + Math.random() * 2, temp: 35 + Math.random() * 3, net: 8 + Math.random() * 10, up: 0 };
function fmtUp(s) {
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor(s / 60) % 60).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${ss}`;
}
setInterval(() => {
  T.pwr = clamp(T.pwr + (Math.random() - .5) * .8, 94, 100);
  T.temp = clamp(T.temp + (Math.random() - .5) * 1, 33, 42);
  T.net = clamp(T.net + (Math.random() - .5) * 8, 6, 48);
  T.up += 2;
  drawTele();
}, 2000);

const bgProcs = [
  'Background scan complete — no anomalies detected',
  'Power cell stable — output optimal',
  'Security sweep — perimeter clear',
  'Satellite uplink synchronized',
  'Thermal levels nominal across all cores',
  'Memory defragmentation complete',
  'Archiving conversation logs — encrypted',
  'Sensor grid calibrated',
  'Standby protocols armed',
  'Network handshake verified — 256-bit secure'
];
const actLines = [];
function bgTick() {
  actLines.push('» [' + stamp() + '] ' + pick(bgProcs));
  while (actLines.length > 4) actLines.shift();
  drawActivity();
}
setInterval(bgTick, 5200);
setTimeout(bgTick, 2500); setTimeout(bgTick, 4500);

/* ---------- WAKE WORD: say "JARVIS" to wake him ----------
   Web-maximum version: works while the page is open and the screen is on.
   True background wake (screen off / app closed) needs a native Android app. */
let wakeMode = false, awake = false, awakeTimer = null;
const wakeChip = document.getElementById('wakechip');
const WAKE_WINDOW = 15000; // stays awake 15s after last command
function wakeModeOn() { return wakeMode; }
function isAwake() { return awake; }

wakeChip.addEventListener('click', () => {
  if (wakeMode) { stopWake(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { speak('Wake word needs Chrome on Android, sir.'); return; }
  wakeMode = true;
  wakeChip.textContent = '◉ WAKE WORD : ARMED';
  wakeChip.classList.add('armed');
  document.body.classList.add('wake-dormant');
  setStatus('DORMANT — SAY "JARVIS"');
  addLog('jarvis', 'Wake-word protocol armed. Say "JARVIS" and I shall awaken.');
  try { speechSynthesis.cancel(); } catch (e) {}
  wakeLoop();
});

function stopWake() {
  wakeMode = false; awake = false;
  clearTimeout(awakeTimer);
  wakeChip.textContent = '◉ WAKE WORD : OFF';
  wakeChip.classList.remove('armed');
  document.body.classList.remove('wake-dormant', 'awake');
  setStatus('STANDBY');
}

function wakeLoop() {
  if (!wakeMode) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    let finals = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tr = e.results[i][0].transcript;
      if (e.results[i].isFinal) finals += tr + ' '; else interim += tr;
    }
    const heard = (finals + ' ' + interim).toLowerCase();
    if (!awake) {
      if (heard.includes('jarvis')) doWakeUp();
    } else if (finals.trim()) {
      const cmd = finals.replace(/jarvis/gi, '').trim();
      handleCommand(cmd || finals.trim());
      prolongAwake();
    }
  };
  rec.onend = () => { if (wakeMode) setTimeout(wakeLoop, 400); }; // auto-restart: always listening
  rec.onerror = (e) => {
    if (!wakeMode) return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      stopWake();
      speak('Microphone access was denied, sir. Wake word disarmed.');
    }

  try { rec.start(); } catch (err) { setTimeout(wakeLoop, 800); }
}

function wrap(ctx, text, maxW) {
  const words = String(text).split(' '), lines = [];
  let line = '';
  for (const wd of words) {
    const t = line ? line + ' ' + wd : wd;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
function frame(ctx, w, h, colCss, title) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(2,12,24,0.66)'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = colCss; ctx.globalAlpha = 0.85; ctx.lineWidth = 3;
  ctx.strokeRect(5, 5, w - 10, h - 10); ctx.globalAlpha = 1;
  ctx.lineWidth = 7; const L = 30;
  ctx.beginPath();
  ctx.moveTo(8+L,8); ctx.lineTo(8,8); ctx.lineTo(8,8+L);
  ctx.moveTo(w-8-L,8); ctx.lineTo(w-8,8); ctx.lineTo(w-8,8+L);
  ctx.moveTo(8,h-8-L); ctx.lineTo(8,h-8); ctx.lineTo(8+L,h-8);
  ctx.moveTo(w-8-L,h-8); ctx.lineTo(w-8,h-8); ctx.lineTo(w-8,h-8-L);
  ctx.stroke();
  if (title) {
    ctx.fillStyle = colCss; ctx.font = '700 22px Orbitron, monospace';
    ctx.fillText(title, 24, 42);

}

/* ---------- procedural textures ---------- */
function makeTickTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d'); x.translate(256, 256);
  x.strokeStyle = 'rgba(255,255,255,0.95)';
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * Math.PI * 2, big = i % 6 === 0;
    x.save(); x.rotate(a); x.lineWidth = big ? 6 : 2;
    x.beginPath(); x.moveTo(big ? 192 : 208, 0); x.lineTo(228, 0); x.stroke(); x.restore();
  }
  x.lineWidth = 3;
  x.beginPath(); x.arc(0, 0, 184, 0, Math.PI*2); x.stroke();
  x.beginPath(); x.arc(0, 0, 236, 0, Math.PI*2); x.stroke();
  return new THREE.CanvasTexture(c);
}
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;

function makeParticles(n, spread, size, color, opacity) {
  const pos = new Float32Array(n*3), vel = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    pos[i*3] = (Math.random()-0.5)*spread;
    pos[i*3+1] = (Math.random()-0.5)*spread*0.7;
    pos[i*3+2] = (Math.random()-0.5)*spread;
    vel[i*3] = (Math.random()-0.5)*0.14; vel[i*3+1] = (Math.random()-0.5)*0.1; vel[i*3+2] = (Math.random()-0.5)*0.14;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = tinted(new THREE.PointsMaterial({ color, size, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false }), 'main');
  const p = new THREE.Points(g, m);
  p.userData = { vel, n, spread };
  return p;
}
function updateParticles(p, dt, boost) {
  const a = p.geometry.attributes.position, v = p.userData.vel, n = p.userData.n, s = p.userData.spread;
  for (let i = 0; i < n; i++) {
    let x = a.array[i*3] + v[i*3]*dt*boost,
        y = a.array[i*3+1] + v[i*3+1]*dt*boost,
        z = a.array[i*3+2] + v[i*3+2]*dt*boost;
    if (x >  s/2) x = -s/2; else if (x < -s/2) x =  s/2;
    if (y >  s*0.35) y = -s*0.35; else if (y < -s*0.35) y = s*0.35;
    if (z >  s/2) z = -s/2; else if (z < -s/2) z =  s/2;
    a.array[i*3] = x; a.array[i*3+1] = y; a.array[i*3+2] = z;
  }
  a.needsUpdate = true;
}

function makePanel(w, h, cw, ch) {

function triggerShockwave() {

  const mesh = new THREE.Mesh(new THREE.RingGeometry(1.7, 1.85, 72),

/* tasteful rising power tone (WebAudio, created on the boot tap gesture) */
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function powerTone(up) {
  if (!actx || reducedMotion) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    const t0 = actx.currentTime;
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(up ? 150 : 680, t0);
    o.frequency.exponentialRampToValueAtTime(up ? 700 : 140, t0 + 1.3);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.045, t0 + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.5);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + 1.6);
  } catch (e) {}
}

/* ---------- render loop (pauses when tab hidden) ---------- */
const clock3 = { last: 0, elapsed: 0 };
let rafId = null, running3d = false;
function faceCameraYaw(mesh) {
  mesh.rotation.y = Math.atan2(camera.position.x - mesh.position.x, camera.position.z - mesh.position.z);
}
function animate() {
  if (!running3d) return;
  rafId = requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - (clock3.last || now)) / 1000, 0.05);
  clock3.last = now; clock3.elapsed += dt;
  const t = clock3.elapsed;

  ariseT += (ariseTarget - ariseT) * Math.min(1, dt * 2.4);
  if (Math.abs(ariseTarget - ariseT) < 0.002) ariseT = ariseTarget;
  const e = easeInOut(ariseT);
  const sBoost = reducedMotion ? 0.12 : 1;

  /* camera: push-in + FOV punch on ARISE */
  camera.position.lerpVectors(camCalm, camCombat, e);
  if (shake > 0.004 && !reducedMotion) {
    camera.position.x += (Math.random()-0.5) * 0.24 * shake;
    camera.position.y += (Math.random()-0.5) * 0.24 * shake;
    shake *= Math.pow(0.015, dt);
  }
  camera.lookAt(0, 0.5, 0);
  const fov = 55 + e * 11;
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }

  /* palette shift cyan → red/orange */
  for (const tm of tintMats) {
    if (tm.kind === 'main') mixMain(tm.m.color);
    else tm.m.color.copy(COL.calmCore).lerp(COL.ariseCore, ariseT);
  }

  /* reactor: idle breathing + ARISE spin-up */
  const breathe = reducedMotion ? 0 : Math.sin(t*1.4)*0.03 + ariseT*Math.sin(t*7)*0.025;
  reactor.scale.setScalar(1 + breathe);
  const gs = 4.4 * (1 + ariseT*0.95 + breathe*2);
  glow.scale.set(gs, gs, 1);
  glow.material.opacity = 0.8 + ariseT*0.2;
  for (const r of rings) r.mesh.rotation.z += r.sp * r.dir * dt * (1 + ariseT*5.5) * sBoost;

  /* particles drift + ARISE burst */
  updateParticles(dust, dt, (1 + ariseT*3.2) * sBoost);
  updateParticles(stars, dt * 0.25, 1);
  dust.material.size = 0.07 + ariseT*0.05;

  /* waveform arc */
  const bcls = document.body.classList;
  const lvl = bcls.contains('listening') ? 1 : bcls.contains('talking') ? 0.85 : bcls.contains('awake') ? 0.5 : 0.28;
  const wspd = (bcls.contains('listening') || bcls.contains('talking')) ? 9 : 2.5;
  waveBars.forEach((bar, i) => {
    bar.scale.y = Math.max(0.12, 0.22 + lvl*(0.55 + 0.45*Math.sin(t*wspd + i*0.7)) * (1.15 + ariseT*0.9));
  });
  if (bcls.contains('listening')) waveMat.color.copy(COL.amber); else mixMain(waveMat.color);

  /* panels: calm ↔ combat layout + yaw billboard */
  for (const p of panels) {
    p.mesh.position.lerpVectors(p.calmV, p.combatV, e);
    faceCameraYaw(p.mesh);
  }
  if (bannerPanel) {
    bannerPanel.mesh.visible = ariseT > 0.03;
    if (bannerPanel.mesh.visible)
      bannerPanel.mesh.material.opacity = 0.72 + 0.28*Math.sin(t*6);
  }

  /* shockwave ring */
  if (shock) {
    shock.t += dt;
    const st = shock.t / 0.9;
    shock.mesh.scale.setScalar(1 + shock.t*9);
    shock.mesh.material.opacity = Math.max(0, 0.85*(1 - st));
    if (st >= 1) { scene3.remove(shock.mesh); shock.mesh.geometry.dispose(); shock.mesh.material.dispose(); shock = null; }
  }

  renderer.render(scene3, camera);
}
document.addEventListener('visibilitychange', () => {
  if (!threeOK) return;
  if (document.hidden) { running3d = false; if (rafId) cancelAnimationFrame(rafId); rafId = null; }
  else if (!rafId) { running3d = true; clock3.last = performance.now(); animate(); }
});

if (threeOK) { running3d = true; init3D(); }

/* ---------- BOOT ---------- */
const bootLines = [
  '> Initializing J.A.R.V.I.S. ...',
  '> Neural network ............ <span class="ok">ONLINE</span>',
  '> Voice synthesis ........... <span class="ok">ONLINE</span>',
  '> Arc reactor ............... <span class="ok">100%</span>',
  '> Holographic matrix ........ <span class="ok">ONLINE</span>',
  '> All systems nominal.'
];
function bootGreeting() {
  const h = new Date().getHours();
  const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  return `Systems online. Good ${part}, ${BOSS}. JARVIS at your service.`;
}
window.addEventListener('load', () => {
  const box = document.getElementById('bootlines');
  const boot = document.getElementById('boot');
  const tap = document.getElementById('bootTap');
  let i = 0;
  const tick = () => {
    if (i < bootLines.length) {
      const d = document.createElement('div'); d.innerHTML = bootLines[i++]; box.appendChild(d);
      setTimeout(tick, 420);
    } else {
      tap.classList.add('show'); // gate: voice unlocks on this tap, on every platform
    }
  };
  const wake = () => {
    boot.removeEventListener('pointerdown', wake);
    boot.classList.add('done');
    ensureAudio(); // unlock WebAudio inside the tap gesture
    if (getUplink()) speak(bootGreeting());
    else { showUplink(); speak('Secure uplink not configured, sir. Enter the backend details to bring me fully online.'); }
  };
  boot.addEventListener('pointerdown', wake);
  tick();
});
</script>
