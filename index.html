<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#010409">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --cyan: #46d8ff;
    --cyan-dim: rgba(70, 216, 255, .28);
    --amber: #ffc857;
  }
  html, body { height: 100%; }
  body {
    background: #010409;
    background-image:
      radial-gradient(ellipse 90% 55% at 50% 32%, rgba(20, 70, 110, .35) 0%, transparent 70%),
      repeating-linear-gradient(0deg, rgba(70,216,255,.045) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(70,216,255,.045) 0 1px, transparent 1px 46px);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 14px 26px;
    overflow-x: hidden;
    position: relative;
  }

  /* HUD corner brackets */
  .corner { position: fixed; width: 26px; height: 26px; border: 2px solid var(--cyan-dim); z-index: 5; pointer-events: none; }
  .c-tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
  .c-tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
  .c-bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; }
  .c-br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

  /* slow scanline sweep */
  #scan { position: fixed; left: 0; right: 0; height: 120px; top: -140px; z-index: 4; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(70,216,255,.06), transparent);
    animation: sweep 7s linear infinite; }
  @keyframes sweep { to { transform: translateY(130vh); } }

  /* ---------- BOOT OVERLAY ---------- */
  #boot { position: fixed; inset: 0; background: #010409; z-index: 50;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity .8s ease; padding: 30px; }
  #boot.done { opacity: 0; pointer-events: none; }
  #bootlines { font-size: .8rem; line-height: 2; min-height: 200px; width: 100%; max-width: 420px; }
  #bootlines .ok { color: #7dffb2; }
  #bootTap { display: none; margin-top: 28px; font-family: 'Orbitron', sans-serif; font-size: .78rem;
    letter-spacing: 4px; color: var(--amber); text-shadow: 0 0 12px var(--amber); cursor: pointer;
    animation: blink 1.2s ease-in-out infinite; }
  #bootTap.show { display: block; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* ---------- HEADER ---------- */
  header { text-align: center; margin: 10px 0 4px; z-index: 2; }
  h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2rem; letter-spacing: 10px;
       color: #eaf7ff; text-shadow: 0 0 18px var(--cyan), 0 0 60px rgba(70,216,255,.5); margin-left: 10px; }
  #sub { font-size: .62rem; letter-spacing: 3px; opacity: .6; margin-top: 6px; }
  #sysrow { display: flex; gap: 14px; justify-content: center; margin-top: 10px; font-size: .66rem; opacity: .85; }
  #sysrow .dot { color: #7dffb2; text-shadow: 0 0 8px #7dffb2; }

  /* ---------- ARC REACTOR ---------- */
  #reactor { position: relative; width: 230px; height: 230px; margin: 14px 0 6px; z-index: 2;
             animation: reactorIn 1.2s ease-out; }
  @keyframes reactorIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #reactor svg.ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spin-a { animation: spin 26s linear infinite; }
  .spin-b { animation: spin 17s linear infinite reverse; }
  .spin-c { animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ring2 { position: absolute; inset: 34px; border-radius: 50%;
           border: 1px solid var(--cyan-dim); box-shadow: 0 0 14px rgba(70,216,255,.35), inset 0 0 14px rgba(70,216,255,.25); }
  .core { position: absolute; inset: 74px; border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #bfeaff 30%, #46d8ff 55%, #0b3b5c 100%);
    box-shadow: 0 0 30px #46d8ff, 0 0 90px rgba(70,216,255,.8), 0 0 160px rgba(70,216,255,.4);
    animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  body.talking .core { animation-duration: .6s; }
  body.talking #reactor { filter: brightness(1.35); }
  body.listening .core { background: radial-gradient(circle, #fff 0%, #ffe9b8 35%, var(--amber) 60%, #5c3a0b 100%);
    box-shadow: 0 0 30px var(--amber), 0 0 90px rgba(255,200,87,.8); }

  /* ---------- STATUS + WAVEFORM ---------- */
  #statusline { font-family: 'Orbitron', sans-serif; font-size: .72rem; letter-spacing: 5px;
    margin: 6px 0 2px; color: #bfeaff; text-shadow: 0 0 10px var(--cyan); min-height: 1.2em; }
  #wave { display: flex; align-items: center; gap: 4px; height: 44px; margin: 4px 0 8px; }
  #wave span { width: 4px; height: 6px; border-radius: 2px; background: var(--cyan-dim); }
  body.listening #wave span, body.talking #wave span {
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
    animation: wv .7s ease-in-out infinite alternate; }
  body.listening #wave span { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  #wave span:nth-child(odd) { animation-delay: .12s; } #wave span:nth-child(3n) { animation-delay: .28s; }
  #wave span:nth-child(4n) { animation-delay: .4s; } #wave span:nth-child(5n) { animation-delay: .2s; }
  @keyframes wv { from { height: 6px; } to { height: 40px; } }

  /* ---------- ORBITING PARTICLES ---------- */
  .orbit { position: absolute; border-radius: 50%; pointer-events: none; }
  .orbit i { position: absolute; top: -3px; left: 50%; margin-left: -3px; width: 6px; height: 6px;
    border-radius: 50%; background: #bfeaff; box-shadow: 0 0 12px var(--cyan), 0 0 4px #fff; }
  .o1 { inset: 16px; animation: spin 8s linear infinite; }
  .o2 { inset: 46px; animation: spin 13s linear infinite reverse; }
  .o3 { inset: 4px; animation: spin 22s linear infinite; }
  .o3 i { background: var(--amber); box-shadow: 0 0 12px var(--amber); }

  /* ---------- LIVE TELEMETRY ---------- */
  #telemetry { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    width: 100%; max-width: 520px; margin: 10px 0 4px; z-index: 2; }
  .tstat { border: 1px solid var(--cyan-dim); background: rgba(1,8,16,.6); padding: 7px 4px; text-align: center;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .tstat .k { font-size: .55rem; opacity: .55; letter-spacing: 2px; }
  .tstat .v { font-family: 'Orbitron', sans-serif; font-size: .78rem; color: #eaf7ff;
    text-shadow: 0 0 8px var(--cyan); margin-top: 3px; }

  /* ---------- BACKGROUND ACTIVITY TICKER ---------- */
  #activity { width: 100%; max-width: 520px; height: 68px; overflow: hidden;
    border-left: 2px solid var(--cyan-dim); background: rgba(1,8,16,.45);
    padding: 7px 10px; font-size: .64rem; opacity: .65; margin-bottom: 10px; z-index: 2; }
  #activity div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.9;
    animation: fadeSlide .5s ease; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateX(-10px); } }

  /* ---------- LOG ---------- */
  #log { width: 100%; max-width: 520px; flex: 1; min-height: 150px; max-height: 30vh; overflow-y: auto;
    border: 1px solid var(--cyan-dim); border-top: 2px solid var(--cyan-dim);
    background: rgba(1, 8, 16, .72); padding: 12px 14px; font-size: .82rem;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    z-index: 2; }
  #log p { margin: 8px 0; line-height: 1.5; }
  #log .ts { opacity: .45; font-size: .68rem; margin-right: 6px; }
  #log .you { color: var(--amber); }
  #log .jarvis { color: #bfeaff; }

  /* ---------- MIC ---------- */
  #micwrap { position: relative; margin: 16px 0 4px; z-index: 2; }
  #mic { width: 88px; height: 88px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #103a5c, #04121f 75%);
    border: 2px solid var(--cyan); color: #eaf7ff;
    box-shadow: 0 0 24px rgba(70,216,255,.55), inset 0 0 18px rgba(70,216,255,.25); }
  #mic:active { transform: scale(.92); }
  #micwrap.listening #mic { border-color: var(--amber); color: #fff;
    box-shadow: 0 0 30px rgba(255,200,87,.7), inset 0 0 18px rgba(255,200,87,.3); }
  .ripple { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--amber);
    opacity: 0; pointer-events: none; }
  #micwrap.listening .ripple { animation: rip 1.6s ease-out infinite; }
  #micwrap.listening .ripple.d2 { animation-delay: .8s; }
  @keyframes rip { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.9); opacity: 0; } }

  /* ---------- WAKE WORD ---------- */
  #wakechip { margin-top: 14px; font-family: 'Orbitron', sans-serif; font-size: .6rem; letter-spacing: 3px;
    background: transparent; border: 1px solid var(--cyan-dim); color: var(--cyan);
    padding: 11px 24px; cursor: pointer; z-index: 2;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  #wakechip.armed { border-color: var(--amber); color: var(--amber);
    box-shadow: 0 0 16px rgba(255,200,87,.45); }
  body.wake-dormant .core { filter: saturate(.5) brightness(.8); }
  body.awake .core { animation-duration: .55s; }
  body.awake #reactor { filter: brightness(1.35); }
  body.awake #wave span { background: var(--amber); box-shadow: 0 0 8px var(--amber);
    animation: wv .55s ease-in-out infinite alternate; }

  #typerow { display: flex; width: 100%; max-width: 520px; margin-top: 12px; gap: 8px; z-index: 2; }
  #textIn { flex: 1; background: rgba(1,8,16,.8); border: 1px solid var(--cyan-dim);
    color: #eaf7ff; padding: 12px; font-family: inherit; font-size: .88rem; outline: none;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
  #textIn:focus { border-color: var(--cyan); }
  #send { background: rgba(16,58,92,.6); border: 1px solid var(--cyan); color: #eaf7ff;
    padding: 0 20px; font-family: 'Orbitron', sans-serif; font-size: .7rem; letter-spacing: 2px; cursor: pointer; }
  #send:active { transform: scale(.95); }

  /* ---------- SECURE UPLINK SETUP ---------- */
  #uplink { position: fixed; inset: 0; background: rgba(1,4,9,.94); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 24px; }
  #uplink.show { display: flex; }
  #uplinkPanel { width: 100%; max-width: 400px; border: 1px solid var(--cyan-dim);
    border-top: 2px solid var(--cyan); background: rgba(1,8,16,.96); padding: 22px 20px;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
  .up-title { font-family: 'Orbitron', sans-serif; font-size: .85rem; letter-spacing: 5px; color: #eaf7ff;
    text-shadow: 0 0 10px var(--cyan); text-align: center; }
  .up-sub { font-size: .58rem; letter-spacing: 3px; opacity: .55; text-align: center; margin: 6px 0 18px; }
  #uplinkPanel label { display: block; font-size: .6rem; letter-spacing: 2px; opacity: .85; margin-bottom: 14px; }
  #uplinkPanel input { display: block; width: 100%; margin-top: 6px; background: rgba(1,8,16,.8);
    border: 1px solid var(--cyan-dim); color: #eaf7ff; padding: 11px 12px;
    font-family: inherit; font-size: .85rem; outline: none; opacity: 1; }
  #uplinkPanel input:focus { border-color: var(--cyan); }
  .up-row { display: flex; gap: 10px; margin-top: 4px; }
  #upSave, #upCancel { flex: 1; font-family: 'Orbitron', sans-serif; font-size: .62rem; letter-spacing: 2px;
    padding: 12px 0; cursor: pointer; }
  #upSave { background: rgba(16,58,92,.6); border: 1px solid var(--cyan); color: #eaf7ff; }
  #upCancel { background: transparent; border: 1px solid var(--cyan-dim); color: var(--cyan); }
  .up-note { font-size: .58rem; opacity: .5; margin-top: 14px; line-height: 1.6; text-align: center; }

  /* ---------- ARMOUR MODE ---------- */
  #armourBanner { display: none; margin: 2px 0 0; font-family: 'Orbitron', sans-serif;
    font-size: .68rem; letter-spacing: 4px; color: #ffd97a;
    text-shadow: 0 0 12px rgba(255,120,60,.9);
    border: 1px solid rgba(255,150,60,.55); background: rgba(60,10,4,.55);
    padding: 8px 18px; z-index: 2;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  body.armour-on #armourBanner { display: block; animation: armourPulse 1.6s ease-in-out infinite; }
  @keyframes armourPulse { 0%,100% { box-shadow: 0 0 6px rgba(255,120,60,.35); }
    50% { box-shadow: 0 0 22px rgba(255,120,60,.85); } }
  body.armour-on #wave span { background: #ff7a4d; box-shadow: 0 0 8px #ff5a3c; }
  body.armour-on .core { background: radial-gradient(circle, #fff 0%, #ffd9a8 30%, #ff8a4d 55%, #5c140b 100%);
    box-shadow: 0 0 30px #ff7a4d, 0 0 90px rgba(255,110,60,.8), 0 0 160px rgba(255,110,60,.4); }
</style>
</head>
<body>

<div class="corner c-tl"></div><div class="corner c-tr"></div>

<!-- BOOT SEQUENCE -->

  <svg class="ring-svg spin-c" viewBox="0 0 200 200">

    <circle cx="100" cy="100" r="70" fill="none" stroke="#46d8ff" stroke-opacity=".3" stroke-width="8" stroke-dasharray="2 14"/>

<div id="telemetry">

      <rect x="9" y="2.5" width="6" height="11" rx="3"/>
      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>

<script>
/* =====================================================================
   JARVIS v3 — neural uplink.
   HUD unchanged; canned brain replaced by secure backend uplink.
   ===================================================================== */
/* ================= ARMOUR TRIGGER PHRASES — ONE-EDIT SWAP =================
   "protocol arise" / "arise" is the user's secret max-performance code word.
   Plain text, case-insensitive substring match — no regex escaping needed. */
const ARMOUR_ON_PHRASES = ["protocol arise", "arise", "armour up", "suit up", "full power"];
const ARMOUR_OFF_PHRASES = ["stand down", "armour off", "power down", "normal mode"];
/* =============== end armour trigger phrases =============== */
const logBox = document.getElementById('log');
const micBtn = document.getElementById('mic');
const micWrap = document.getElementById('micwrap');
const statusLine = document.getElementById('statusline');
const BOSS = 'sir';

function setStatus(s) { statusLine.textContent = s; }
function stamp() { return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); }

function addLog(who, text) {
  const p = document.createElement('p');
  p.className = who;
  const ts = document.createElement('span');
  ts.className = 'ts'; ts.textContent = '[' + stamp() + ']';
  p.appendChild(ts);
  p.appendChild(document.createTextNode((who === 'you' ? 'YOU: ' : 'JARVIS: ') + text));
  logBox.appendChild(p);
  logBox.scrollTop = logBox.scrollHeight;
}

/* ---------- CLOCK ---------- */
setInterval(() => { document.getElementById('clock').textContent = stamp(); }, 1000);
document.getElementById('clock').textContent = stamp();

/* ---------- VOICE ---------- */
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const prefs = [/Google UK English Male/i, /Daniel/i, /Google US English/i,
                 /Microsoft (Guy|David|James)/i, /Alex/i, /Fred/i];
  for (const p of prefs) { const v = vs.find(v => p.test(v.name)); if (v) return v; }
  return vs.find(v => v.lang && v.lang.startsWith('en')) || null;
}
function speak(text) {
  addLog('jarvis', text);
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 0.75; u.lang = 'en-US'; // deeper, calmer delivery
    const v = pickVoice(); if (v) u.voice = v;
    document.body.classList.add('talking'); setStatus('SPEAKING');
    const endSpeech = () => {
      document.body.classList.remove('talking');
      if (wakeModeOn()) setStatus(isAwake() ? 'AWAKE — SPEAK NOW' : 'DORMANT — SAY "JARVIS"');
      else setStatus('STANDBY');
    };
    u.onend = u.onerror = endSpeech;
    // iOS Safari goes silent if cancel() and speak() run back-to-back while idle.
    // Only cancel when something is actually speaking, then give it a breath.
    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
      setTimeout(() => speechSynthesis.speak(u), 150);
    } else {
      speechSynthesis.speak(u);
    }
  } catch (e) {
    document.body.classList.remove('talking');
    setStatus(wakeModeOn() ? (isAwake() ? 'AWAKE — SPEAK NOW' : 'DORMANT — SAY "JARVIS"') : 'STANDBY');
  }
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- SECURE UPLINK (neural core connection) ---------- */
// Pages build marker — do not remove:
const uplinkSetup = 'v1-brain';
const UPLINK_LS_URL = 'jarvis_uplink_url';
const UPLINK_LS_KEY = 'jarvis_uplink_key';
function getUplink() {
  const url = (localStorage.getItem(UPLINK_LS_URL) || '').trim().replace(/\/+$/, '');
  const key = (localStorage.getItem(UPLINK_LS_KEY) || '').trim();
  return (url && key) ? { url, key } : null;
}
function showUplink() {
  document.getElementById('upUrl').value = localStorage.getItem(UPLINK_LS_URL) || '';
  document.getElementById('upKey').value = ''; // never display the passphrase back
  document.getElementById('uplink').classList.add('show');
  setStatus('UPLINK CONFIG');
}
function hideUplink() { document.getElementById('uplink').classList.remove('show'); }
document.getElementById('upSave').addEventListener('click', () => {
  const url = document.getElementById('upUrl').value.trim().replace(/\/+$/, '');
  const key = document.getElementById('upKey').value.trim();
  if (!url || !key || !/^https?:\/\//i.test(url)) { setStatus('INVALID UPLINK DATA'); return; }
  localStorage.setItem(UPLINK_LS_URL, url);
  localStorage.setItem(UPLINK_LS_KEY, key);
  hideUplink();
  speak('Secure uplink established, sir. I am fully online.');
});
document.getElementById('upCancel').addEventListener('click', () => { hideUplink(); setStatus('STANDBY'); });
// long-press (800ms) the arc reactor to reopen uplink settings
(function () {
  let pressT = null;
  const reactor = document.getElementById('reactor');
  reactor.addEventListener('pointerdown', () => {
    clearTimeout(pressT);
    pressT = setTimeout(showUplink, 800);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    reactor.addEventListener(ev, () => clearTimeout(pressT)));
})();

/* ---------- BRAIN: neural core (backend) ---------- */
let convoHistory = []; // last 10 exchanges, kept client-side only
async function askBrain(raw) {
  const cfg = getUplink();
  if (!cfg) { showUplink(); speak('The secure uplink is not configured yet, sir.'); return; }
  setStatus('CONSULTING NEURAL CORE');
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 60000);
    const res = await fetch(cfg.url + '/api/chat', {
      method: 'POST',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'x-jarvis-key': cfg.key },
      body: JSON.stringify({ message: raw, history: convoHistory.slice(-20), armour: armourMode })
    });
    clearTimeout(to);
    const data = await res.json().catch(() => ({}));
    const reply = (data && data.reply ? String(data.reply) : '').trim();
    if (!reply) throw new Error('empty uplink reply');
    convoHistory.push({ role: 'user', content: raw.slice(0, 500) });
    convoHistory.push({ role: 'assistant', content: reply.slice(0, 500) });
    while (convoHistory.length > 20) convoHistory.shift();
    speak(reply);
  } catch (e) {
    speak('Sir, my uplink to the neural core faltered. Give me a moment, then try again.');
  }
}

/* ---------- ARMOUR MODE ---------- */
let armourMode = false; // session state; sent with every /api/chat call
function matchesAny(t, phrases) { return phrases.some(p => t.includes(p)); }
function setArmour(on) {
  armourMode = on;
  document.body.classList.toggle('armour-on', on);
}

/* ---------- COMMANDS: instant device actions stay local, everything else -> neural core ---------- */
function handleCommand(raw) {
  const t = raw.toLowerCase().trim();
  addLog('you', raw);
  const hitOn = matchesAny(t, ARMOUR_ON_PHRASES);
  const hitOff = matchesAny(t, ARMOUR_OFF_PHRASES);
  if (hitOn && !hitOff) {
    const protocol = t.includes('arise');
    if (!armourMode) { setArmour(true); speak(protocol ? 'Protocol ARISE acknowledged, sir. All systems at maximum.' : 'Armour online, sir. Full potential engaged.'); }
    else speak(protocol ? 'Protocol ARISE is already active, sir.' : 'Armour is already online, sir.');
    return;
  }
  if (hitOff) {
    if (armourMode) { setArmour(false); speak('Armour disengaged, sir.'); }
    else speak('Armour is already offline, sir.');
    return;
  }
  if (t.includes('open youtube')) { speak('Opening YouTube, sir.'); return window.open('https://m.youtube.com', '_blank'); }
  if (t.includes('open google'))  { speak('Opening Google, sir.');  return window.open('https://www.google.com', '_blank'); }
  if (t.includes('ascend'))       { speak('Opening ASCEND, sir. Time to climb.'); return window.open('https://www.ascendlevelup.run.place', '_blank'); }
  const m = t.match(/search for (.+)/) || t.match(/google (.+)/);
  if (m) { speak('Searching for ' + m[1] + ', sir.'); return window.open('https://www.google.com/search?q=' + encodeURIComponent(m[1]), '_blank'); }
  askBrain(raw);
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------- EARS ---------- */
let recognizing = false;
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { speak('I am afraid this browser cannot hear, sir. Please type below, or open me in Chrome on Android.'); return; }
  if (recognizing) return;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { recognizing = true; micWrap.classList.add('listening');
    document.body.classList.add('listening'); setStatus('LISTENING'); };
  const stopUI = () => { recognizing = false; micWrap.classList.remove('listening');
    document.body.classList.remove('listening'); if (statusLine.textContent === 'LISTENING') setStatus('STANDBY'); };
  rec.onend = stopUI;
  rec.onerror = (e) => { stopUI();
    if (e.error === 'not-allowed') speak('Microphone access was denied, sir. Allow it and try again.');
    else if (e.error === 'no-speech') setStatus('STANDBY');
    else if (e.error === 'network') speak('I seem to have lost my connection, sir. Check the internet and try again.');
  };
  rec.onresult = (e) => handleCommand(e.results[0][0].transcript);
  try { rec.start(); } catch (e) { stopUI(); }
}
micBtn.addEventListener('click', listen);

/* ---------- TYPE ---------- */
const textIn = document.getElementById('textIn');
function sendTyped() { const v = textIn.value.trim(); if (!v) return; textIn.value = ''; handleCommand(v); }
document.getElementById('send').addEventListener('click', sendTyped);
textIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTyped(); });

/* ---------- LIVING SYSTEM: telemetry + background processes ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const T = { pwr: 97 + Math.random() * 2, temp: 35 + Math.random() * 3, net: 8 + Math.random() * 10, up: 0 };
function fmtUp(s) {
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor(s / 60) % 60).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${ss}`;
}
setInterval(() => {
  T.pwr = clamp(T.pwr + (Math.random() - .5) * .8, 94, 100);
  T.temp = clamp(T.temp + (Math.random() - .5) * 1, 33, 42);
  T.net = clamp(T.net + (Math.random() - .5) * 8, 6, 48);
  T.up += 2;
  document.getElementById('tPwr').textContent = T.pwr.toFixed(1) + '%';
  document.getElementById('tTemp').textContent = T.temp.toFixed(1) + '°C';
  document.getElementById('tNet').textContent = Math.round(T.net) + 'ms';
  document.getElementById('tUp').textContent = fmtUp(T.up);
}, 2000);

const bgProcs = [
  'Background scan complete — no anomalies detected',
  'Power cell stable — output optimal',
  'Security sweep — perimeter clear',
  'Satellite uplink synchronized',
  'Thermal levels nominal across all cores',
  'Memory defragmentation complete',
  'Archiving conversation logs — encrypted',
  'Sensor grid calibrated',
  'Standby protocols armed',
  'Network handshake verified — 256-bit secure'
];
function bgTick() {
  const box = document.getElementById('activity');
  if (!box) return;
  const d = document.createElement('div');
  d.textContent = '» [' + stamp() + '] ' + pick(bgProcs);
  box.appendChild(d);

setInterval(bgTick, 5200);
setTimeout(bgTick, 2500); setTimeout(bgTick, 4500);

/* ---------- WAKE WORD: say "JARVIS" to wake him ----------
   Web-maximum version: works while the page is open and the screen is on.
   True background wake (screen off / app closed) needs a native Android app. */
let wakeMode = false, awake = false, awakeTimer = null;
const wakeChip = document.getElementById('wakechip');
const WAKE_WINDOW = 15000; // stays awake 15s after last command
function wakeModeOn() { return wakeMode; }
function isAwake() { return awake; }

wakeChip.addEventListener('click', () => {
  if (wakeMode) { stopWake(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { speak('Wake word needs Chrome on Android, sir.'); return; }
  wakeMode = true;
  wakeChip.textContent = '◉ WAKE WORD : ARMED';
  wakeChip.classList.add('armed');
  document.body.classList.add('wake-dormant');
  setStatus('DORMANT — SAY "JARVIS"');
  addLog('jarvis', 'Wake-word protocol armed. Say "JARVIS" and I shall awaken.');
  try { speechSynthesis.cancel(); } catch (e) {}
  wakeLoop();
});

function stopWake() {
  wakeMode = false; awake = false;
  clearTimeout(awakeTimer);
  wakeChip.textContent = '◉ WAKE WORD : OFF';
  wakeChip.classList.remove('armed');
  document.body.classList.remove('wake-dormant', 'awake');
  setStatus('STANDBY');
}

function wakeLoop() {
  if (!wakeMode) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    let finals = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tr = e.results[i][0].transcript;
      if (e.results[i].isFinal) finals += tr + ' '; else interim += tr;
    }
    const heard = (finals + ' ' + interim).toLowerCase();
    if (!awake) {
      if (heard.includes('jarvis')) doWakeUp();
    } else if (finals.trim()) {
      const cmd = finals.replace(/jarvis/gi, '').trim();
      handleCommand(cmd || finals.trim());
      prolongAwake();
    }
  };
  rec.onend = () => { if (wakeMode) setTimeout(wakeLoop, 400); }; // auto-restart: always listening
  rec.onerror = (e) => {
    if (!wakeMode) return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      stopWake();
      speak('Microphone access was denied, sir. Wake word disarmed.');
    }
  };
  try { rec.start(); } catch (err) { setTimeout(wakeLoop, 800); }
}

function doWakeUp() {
  awake = true;
  document.body.classList.remove('wake-dormant');
  document.body.classList.add('awake');
  setStatus('AWAKE — SPEAK NOW');
  speak('Yes, sir?');
  prolongAwake();
}
function prolongAwake() {
  clearTimeout(awakeTimer);
  awakeTimer = setTimeout(() => {
    awake = false;
    document.body.classList.remove('awake');
    document.body.classList.add('wake-dormant');
    setStatus('DORMANT — SAY "JARVIS"');
  }, WAKE_WINDOW);
}

const bootLines = [
  '> Initializing J.A.R.V.I.S. ...',
  '> Neural network ............ <span class="ok">ONLINE</span>',
  '> Voice synthesis ........... <span class="ok">ONLINE</span>',
  '> Arc reactor ............... <span class="ok">100%</span>',
  '> All systems nominal.'
];
function bootGreeting() {
  const h = new Date().getHours();
  const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  return `Systems online. Good ${part}, ${BOSS}. JARVIS at your service.`;
}
window.addEventListener('load', () => {
  const box = document.getElementById('bootlines');
  const boot = document.getElementById('boot');
  const tap = document.getElementById('bootTap');
  let i = 0;
  const tick = () => {
    if (i < bootLines.length) {
      const d = document.createElement('div'); d.innerHTML = bootLines[i++]; box.appendChild(d);
      setTimeout(tick, 420);
    } else {
      tap.classList.add('show'); // gate: voice unlocks on this tap, on every platform
    }
  };
  const wake = () => {
    boot.removeEventListener('pointerdown', wake);
    boot.classList.add('done');
    if (getUplink()) speak(bootGreeting()); // inside the tap gesture: voice is allowed everywhere
    else { showUplink(); speak('Secure uplink not configured, sir. Enter the backend details to bring me fully online.'); }
  };
  boot.addEventListener('pointerdown', wake);
  tick();
});
